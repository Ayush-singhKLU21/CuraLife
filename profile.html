<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My profile | CarePoint</title><link rel="stylesheet" href="css/style.css"></head>
<body class="app-body"><aside class="sidebar"><a class="brand side-brand" href="index.html"><span class="brand-mark">✚</span> CarePoint</a><div class="side-label">WORKSPACE</div><nav class="side-nav"><a href="user.html" data-page="user">⌂ <span>Overview</span></a><a href="appointments.html" data-page="appointments">▦ <span>Appointments</span></a><a href="records.html" data-page="records">▤ <span>Medical records</span></a><a href="profile.html" data-page="profile">◉ <span>My profile</span></a></nav><div class="sidebar-bottom"><div class="sidebar-help"> <span>✦</span><b>CarePoint</b><small>Health records made simple</small></div><button class="side-logout" id="logoutBtn">↪ &nbsp; Log out</button></div></aside>
<div class="app-main"><header class="app-header"><div><p class="breadcrumb">WORKSPACE / MY PROFILE</p><h1>My profile</h1></div><div class="header-user"><div class="avatar" id="userAvatar">U</div><div><b id="headerName">User</b><small id="headerRole">Account</small></div></div></header>
<main class="page-content">
<section class="content-card narrow-card"><div class="section-heading"><div><span class="eyebrow">PERSONAL INFORMATION</span><h2>Profile details</h2><p class="muted">Update the details associated with your account.</p></div><div class="profile-big-avatar">◉</div></div>
<form id="profileForm" class="app-form form-grid"><label>Full name<input id="name" required></label><label>Email address<input id="email" type="email" disabled></label><label>Phone number<input id="phone" type="tel"></label><label>Age<input id="age" type="number" min="0" max="120" placeholder="Age"></label><label>Gender<select id="gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label class="full-field">Address<textarea id="address" rows="3" placeholder="Your address"></textarea></label><div class="full-field"><button class="btn btn-primary" type="submit">Save changes</button></div></form><p id="message" class="form-message" role="status"></p></section>
</main><footer class="app-footer">CarePoint · Academic project demonstration</footer></div>
<script src="js/common.js"></script><script src="js/user.js"></script></body></html>
