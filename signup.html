<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create account | CarePoint</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><a class="brand auth-brand" href="index.html"><span class="brand-mark">✚</span> CarePoint</a><main class="auth-wrap signup-wrap"><section class="auth-panel"><span class="eyebrow">JOIN CAREPOINT</span><h1>Create your<br><span>account.</span></h1><p class="muted">Enter your details to get started.</p><form id="signupForm" class="app-form"><label>Full name<input id="name" placeholder="Your full name" required></label><label>Email address<input id="email" type="email" placeholder="you@example.com" required></label><label>Phone number<input id="phone" type="tel" placeholder="Phone number" required></label><label>Password<input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></label><button class="btn btn-primary btn-full" type="submit">Create account <span>→</span></button></form><p id="message" class="form-message" role="status"></p><p class="auth-bottom">Already registered? <a href="login.html">Sign in</a></p></section><aside class="auth-aside"><div class="aside-symbol">♡</div><h2>Your health<br>journey, simplified.</h2><p>Create an account to view your dashboard, manage appointments and access your saved records.</p><div class="aside-stat"><b>03</b><span>Simple steps to get started</span></div></aside></main><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
